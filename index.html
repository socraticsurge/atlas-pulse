<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/atlas-pulse-icon.png" />
    <link rel="apple-touch-icon" href="/atlas-pulse-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Pulse — Your Personal RSS Feed Reader</title>
    <meta name="description" content="Atlas Pulse — A modern, free, and privacy-first RSS feed reader. Subscribe to blogs, news, and content feeds. Read articles in a clean, distraction-free interface." />
    <meta name="theme-color" content="#0f1117" />
    <script>
      // Apply the saved appearance before first paint so a light theme or a
      // custom color does not flash the defaults. AppearanceContext takes over
      // once React mounts; keep the keys and defaults in sync with it.
      try {
        var get = function (key, fallback) { return localStorage.getItem(key) || fallback; };
        var root = document.documentElement;
        root.setAttribute('data-theme', get('atlas-pulse-theme', get('feedflow-theme', 'dark')));
        var fontStack = localStorage.getItem('atlas-pulse-font-stack');
        if (fontStack) root.style.setProperty('--font-family', fontStack);
        root.setAttribute('data-color', get('atlas-pulse-color', 'emerald'));
        root.setAttribute('data-text', get('atlas-pulse-text', 'default'));
        if (root.getAttribute('data-color') === 'custom') root.style.setProperty('--accent', get('atlas-pulse-custom-color', '#00d4aa'));
        if (root.getAttribute('data-text') === 'custom') root.style.setProperty('--text-primary', get('atlas-pulse-custom-text', '#e8eaed'));
      } catch (e) { /* storage blocked: React applies the defaults */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
