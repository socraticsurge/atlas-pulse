name: Scorecard

# OpenSSF Scorecard rates the repo's supply-chain practices and publishes the
# result to api.scorecard.dev, which serves the README badge. Publishing only
# accepts a plain workflow: no top-level env or defaults, no containers, and
# only well-known actions in the analysis job.

on:
  push:
    branches: ["master"]
  # Re-score when branch protection changes, and weekly (Mondays 07:30 UTC)
  # to pick up new checks.
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Signs the published result with GitHub's OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The full results stay on the run as an artifact. They are not sent to
      # code scanning, where findings a one-maintainer repo can't satisfy
      # (Code-Review, Contributors) would sit as permanent open alerts.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
